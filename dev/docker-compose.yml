version: "3.8"

networks:
  crosstalk-dev:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=crosstalk
    networks:
      - crosstalk-dev
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: dev/Dockerfile.server
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../server:/app/server
      - ../proto:/app/proto
      - server-data:/data
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - "8088:8080"
      - "5000:5000/udp"
    networks:
      - crosstalk-dev
    environment:
      - CT_ADDR=:8080
      - CT_DATABASE_URL=postgres://postgres:postgres@postgres:5432/crosstalk?sslmode=disable
      - CT_JWT_SECRET=dev-secret
      - CT_ADMIN_PASSWORD=admin
      - CT_UDP_MUX_PORT=5000

volumes:
  server-data:
  pg-data:
  go-mod-cache:
  go-build-cache:
