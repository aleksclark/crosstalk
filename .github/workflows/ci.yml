name: CI

on:
  push:
    branches: [master, production-integration]
  pull_request:
    branches: [master, production-integration]
  workflow_dispatch:
    inputs:
      run_physical_android:
        description: "Request android-physical-audio on self-hosted runner"
        type: boolean
        default: true

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install libopus (CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev

      - name: golangci-lint server
        uses: golangci/golangci-lint-action@v7
        env:
          CGO_ENABLED: "1"
        with:
          version: latest
          working-directory: server

      - name: golangci-lint cli
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: cli

      - name: golangci-lint abc
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: abc

  test-unit-go:
    name: Unit Tests (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install libopus + ffmpeg (CGO / ct-play)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev ffmpeg

      - name: Test server
        working-directory: server
        env:
          CGO_ENABLED: "1"
          CT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./... -count=1

      - name: Test cli
        working-directory: cli
        run: go test ./... -count=1

      - name: Test abc
        working-directory: abc
        run: go test ./... -count=1

  test-unit-ts:
    name: Type Check (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Install libopus (CGO; required to run gen-openapi)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev

      - name: Generate OpenAPI spec + TS types from the server
        env:
          CGO_ENABLED: "1"
        run: |
          cd server && go run ./cmd/gen-openapi ../api/openapi.json
          cd .. && pnpm install --frozen-lockfile
          pnpm --filter @crosstalk/api-client generate

      - name: TypeScript check (api-client)
        run: pnpm --filter @crosstalk/api-client exec tsc --noEmit

      - name: TypeScript check (apps)
        run: |
          pnpm --filter @crosstalk/admin exec tsc -b --noEmit
          pnpm --filter @crosstalk/translator exec tsc -b --noEmit
          pnpm --filter @crosstalk/broadcast exec tsc -b --noEmit

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs: [test-unit-go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install libopus (CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev

      - name: Build server binary
        working-directory: server
        env:
          CGO_ENABLED: "1"
        run: go build -o ../bin/ct-server ./cmd/ct-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ct-server
          path: bin/ct-server

  build-apps:
    name: Build Web Apps
    runs-on: ubuntu-latest
    needs: [test-unit-ts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Install libopus (CGO; required to run gen-openapi)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev

      - name: Generate OpenAPI spec from the server
        env:
          CGO_ENABLED: "1"
        run: cd server && go run ./cmd/gen-openapi ../api/openapi.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps (regenerates types via prebuild hooks)
        run: |
          pnpm --filter @crosstalk/admin build
          pnpm --filter @crosstalk/translator build
          pnpm --filter @crosstalk/broadcast build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit-go]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install libopus + ffmpeg (CGO / ct-play)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev ffmpeg

      - name: Build ct-play
        run: cd cli && go build -o ../bin/ct-play ./cmd/ct-play

      - name: Run integration tests
        working-directory: server
        env:
          CGO_ENABLED: "1"
          CT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./cmd/ct-server/ -run Integration -v -count=1 -timeout 10m

  e2e:
    name: E2E (SPAs + real audio)
    runs-on: ubuntu-latest
    needs: [test-unit-go]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Install libopus (CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev

      - name: Install Playwright + Chromium
        working-directory: test/playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run SPA-driven e2e (admin + translator + broadcast + golden audio)
        env:
          CGO_ENABLED: "1"
          CT_TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: bash test/run-e2e.sh

  # ── Android translator gates (Lane F) ───────────────────────────────────

  android-static:
    name: Android Static (lint/unit/assemble)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-translator
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform / build-tools 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Validate Gradle wrapper
        run: |
          test -x ./gradlew
          grep -q '8.11.1' gradle/wrapper/gradle-wrapper.properties

      - name: OpenAPI generate + drift check
        run: bash scripts/check-openapi-generated.sh

      - name: Lint + unit tests
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest

      - name: Assemble debug + release
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-static-reports
          path: |
            apps/android-translator/app/build/reports/
            apps/android-translator/app/build/test-results/
          if-no-files-found: ignore

  android-instrumented-api35:
    name: Android Instrumented (API 35 emulator)
    runs-on: ubuntu-latest
    needs: [android-static]
    defaults:
      run:
        working-directory: apps/android-translator
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check KVM
        id: kvm
        run: |
          if [[ -e /dev/kvm ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM available"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "NOTICE: /dev/kvm missing — instrumented emulator job will skip cleanly (not a silent green for physical)."
          fi

      # Without world-writable /dev/kvm, acceleration is denied and API 35
      # google_apis images hang forever on sys.boot_completed (seen as 600s timeout).
      - name: Enable KVM device access
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          # Prove the runner user can open KVM (not merely that the node exists).
          python3 - <<'PY'
          import os, stat
          st = os.stat("/dev/kvm")
          mode = st.st_mode
          print(f"mode={oct(mode)} uid={st.st_uid} gid={st.st_gid}")
          fd = os.open("/dev/kvm", os.O_RDWR)
          os.close(fd)
          print("kvm_open_ok")
          PY

      - name: Install emulator packages
        if: steps.kvm.outputs.available == 'true'
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" \
            "system-images;android-35;google_apis;x86_64" "emulator" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true

      - name: local.properties
        if: steps.kvm.outputs.available == 'true'
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Run connected tests on emulator
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096
          heap-size: 512
          disk-size: 4096M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          working-directory: apps/android-translator
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Skip notice (no KVM)
        if: steps.kvm.outputs.available != 'true'
        run: |
          {
            echo "## Android instrumented API 35"
            echo ""
            echo "Skipped cleanly: no KVM on runner. Lifecycle instrumented tests require an emulator or device."
            echo "Physical bidirectional audio remains gated by **android-physical-audio** (fail-closed / pending without runner)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload instrumented reports
        if: always() && steps.kvm.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: |
            apps/android-translator/app/build/reports/androidTests/
            apps/android-translator/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  android-physical-audio:
    name: Android Physical Audio (required evidence)
    # Self-hosted label set. If no runner is registered, GitHub keeps the check
    # pending/queued rather than green-skipping — fail-closed for merge gates.
    # Also invokable via workflow_dispatch.
    runs-on: [self-hosted, linux, android-audio]
    needs: [android-static]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Preflight physical runner
        run: |
          set -euo pipefail
          echo "Physical Android audio gate — labels: self-hosted, linux, android-audio"
          command -v adb
          adb start-server
          mapfile -t devs < <(adb devices | awk 'NR>1 && $2=="device"{print $1}')
          if [[ ${#devs[@]} -eq 0 ]]; then
            echo "::error::No physical Android device attached to self-hosted android-audio runner"
            echo "PHYSICAL REQUIRED: attach API 35 phone + calibrated 440/880 injectors"
            exit 1
          fi
          echo "device_count=${#devs[@]}"
          if [[ -z "${CROSSTALK_BASE_URL:-}" ]]; then
            echo "::error::CROSSTALK_BASE_URL env/secret required on physical runner"
            exit 1
          fi
          if [[ -z "${CROSSTALK_ADMIN_PASSWORD:-}" ]]; then
            echo "::error::CROSSTALK_ADMIN_PASSWORD required on physical runner (never log value)"
            exit 1
          fi

      - name: Run device golden harness
        env:
          CROSSTALK_SLEEP_SECONDS: "600"
          # Never set CROSSTALK_ALLOW_EMULATOR on this job.
        run: bash test/android/run-device-golden.sh

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-physical-evidence
          path: /tmp/ct-android-golden-*/android-golden-evidence.tgz
          if-no-files-found: warn
