name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: golangci-lint server
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: server

      - name: golangci-lint cli
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: cli

  test-unit-go:
    name: Unit Tests (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test server
        working-directory: server
        run: go test ./... -count=1

      - name: Test cli
        working-directory: cli
        run: go test ./... -count=1

  test-unit-ts:
    name: Type Check (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (web)
        run: pnpm --filter './web' exec tsc --noEmit

      - name: TypeScript check (packages)
        run: pnpm --filter './packages/*' exec tsc --noEmit

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs: [test-unit-go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build server binary
        working-directory: server
        run: CGO_ENABLED=1 go build -o ../bin/ct-server ./cmd/ct-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ct-server
          path: bin/ct-server

  build-apps:
    name: Build Web Apps
    runs-on: ubuntu-latest
    needs: [test-unit-ts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter './web' build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit-go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run integration tests
        working-directory: server
        run: go test ./cmd/ct-server/ -run Integration -v -count=1
