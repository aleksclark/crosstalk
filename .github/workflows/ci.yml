name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install libopus (CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev

      - name: golangci-lint server
        uses: golangci/golangci-lint-action@v7
        env:
          CGO_ENABLED: "1"
        with:
          version: latest
          working-directory: server

      - name: golangci-lint cli
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: cli

  test-unit-go:
    name: Unit Tests (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install libopus + ffmpeg (CGO / ct-play)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev ffmpeg

      - name: Test server
        working-directory: server
        env:
          CGO_ENABLED: "1"
          CT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./... -count=1

      - name: Test cli
        working-directory: cli
        run: go test ./... -count=1

  test-unit-ts:
    name: Type Check (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Install libopus (CGO; required to run gen-openapi)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev

      - name: Generate OpenAPI spec + TS types from the server
        env:
          CGO_ENABLED: "1"
        run: |
          cd server && go run ./cmd/gen-openapi ../api/openapi.json
          cd .. && pnpm install --frozen-lockfile
          pnpm --filter @crosstalk/api-client generate

      - name: TypeScript check (api-client)
        run: pnpm --filter @crosstalk/api-client exec tsc --noEmit

      - name: TypeScript check (apps)
        run: |
          pnpm --filter @crosstalk/admin exec tsc -b --noEmit
          pnpm --filter @crosstalk/translator exec tsc -b --noEmit
          pnpm --filter @crosstalk/broadcast exec tsc -b --noEmit

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs: [test-unit-go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install libopus (CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev

      - name: Build server binary
        working-directory: server
        env:
          CGO_ENABLED: "1"
        run: go build -o ../bin/ct-server ./cmd/ct-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ct-server
          path: bin/ct-server

  build-apps:
    name: Build Web Apps
    runs-on: ubuntu-latest
    needs: [test-unit-ts]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Install libopus (CGO; required to run gen-openapi)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev

      - name: Generate OpenAPI spec from the server
        env:
          CGO_ENABLED: "1"
        run: cd server && go run ./cmd/gen-openapi ../api/openapi.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps (regenerates types via prebuild hooks)
        run: |
          pnpm --filter @crosstalk/admin build
          pnpm --filter @crosstalk/translator build
          pnpm --filter @crosstalk/broadcast build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit-go]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install libopus + ffmpeg (CGO / ct-play)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev ffmpeg

      - name: Build ct-play
        run: cd cli && go build -o ../bin/ct-play ./cmd/ct-play

      - name: Run integration tests
        working-directory: server
        env:
          CGO_ENABLED: "1"
          CT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./cmd/ct-server/ -run Integration -v -count=1 -timeout 10m

  e2e:
    name: E2E (SPAs + real audio)
    runs-on: ubuntu-latest
    needs: [test-unit-go]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Install libopus (CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev

      - name: Install Playwright + Chromium
        working-directory: test/playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run SPA-driven e2e (admin + translator + broadcast + golden audio)
        env:
          CGO_ENABLED: "1"
          CT_TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: bash test/run-e2e.sh

