version: "3"

vars:
  OAPI_CODEGEN: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.1
  SPEC_FILE: api/openapi.json

tasks:
  # ── Test Tasks ─────────────────────────────────────────────────

  test:unit:go:
    desc: Run Go unit tests for abc, server, and cli
    cmds:
      - pkg-config --exists opus
      - cd abc && go test ./...
      - cd server && CGO_ENABLED=1 go test ./audiocodec ./mixer ./sessionrtc ./webrtc ./api ./ownership ./mediaticket ./postgres -count=1
      - cd server && CGO_ENABLED=1 go test ./...
      - cd cli && go test ./...

  test:unit:ts:
    desc: Run TypeScript type checking on all apps
    cmds:
      - pnpm --filter './apps/*' exec tsc --noEmit
      - pnpm --filter './packages/*' exec tsc --noEmit
    ignore_error: true

  test:integration:
    desc: Run integration + audio-flow tests (in-process Go server + real PostgreSQL)
    env:
      CT_TEST_DATABASE_URL: '{{.CT_TEST_DATABASE_URL | default "postgres://postgres:postgres@127.0.0.1:55432/postgres?sslmode=disable"}}'
      CT_TEST_MODE: "1"
    cmds:
      - pkg-config --exists opus
      - cd server && CGO_ENABLED=1 go test ./cmd/ct-server/ -run Integration -v -count=1 -timeout 10m

  test:e2e:
    desc: Run the SPA-driven end-to-end suite (Playwright + real audio). Builds the
      SPAs, embeds them in ct-server, starts it against a fresh PostgreSQL, and
      drives the admin/translator/broadcast apps in real browsers.
    env:
      CT_TEST_DATABASE_ADMIN_URL: '{{.CT_TEST_DATABASE_ADMIN_URL | default "postgres://postgres:postgres@127.0.0.1:55432/postgres?sslmode=disable"}}'
      CT_TEST_MODE: "1"
    cmds:
      - bash test/run-e2e.sh {{.CLI_ARGS}}

  test:e2e:play:
    desc: Full-process ct-play E2E (real server, PostgreSQL, ffmpeg, audio content)
    env:
      CT_TEST_DATABASE_URL: '{{.CT_TEST_DATABASE_URL | default "postgres://postgres:postgres@127.0.0.1:55432/postgres?sslmode=disable"}}'
      CT_TEST_MODE: "1"
    cmds:
      - pkg-config --exists opus
      - command -v ffmpeg >/dev/null
      - task: build:play
      - cd server && CGO_ENABLED=1 go test ./cmd/ct-server/ -run 'TestIntegrationCtPlay' -v -count=1 -timeout 15m

  test:all:
    desc: Run all tests (unit + integration)
    cmds:
      - task: test:unit:go
      - task: test:unit:ts
      - task: test:integration

  # ── Build Tasks ────────────────────────────────────────────────

  build:server:
    desc: Build server binary (CGO required for production Opus/libopus)
    cmds:
      - pkg-config --exists opus
      - cd server && CGO_ENABLED=1 go build -o ../bin/ct-server ./cmd/ct-server

  build:cli:
    desc: Build CLI binary
    cmds:
      - cd cli && CGO_ENABLED=1 go build -o ../bin/ct-client ./cmd/ct-client

  build:play:
    desc: Build ct-play binary (file playback CLI)
    cmds:
      - cd cli && CGO_ENABLED=0 go build -o ../bin/ct-play ./cmd/ct-play

  build:netcfg:
    desc: Build WiFi captive-portal provisioning binary
    cmds:
      - cd cli && CGO_ENABLED=0 go build -o ../bin/ct-netcfg ./cmd/ct-netcfg

  build:cli:arm64:
    desc: Cross-compile ct-client for K2B (aarch64); ct-abc shares client stack
    cmds:
      - cd cli && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../bin/ct-client-arm64 ./cmd/ct-client

  build:abc:arm64:
    desc: Cross-compile ct-abc (Audio Booth Connector) for K2B aarch64
    cmds:
      - cd cli && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../bin/ct-abc-arm64 ./cmd/ct-abc

  build:netcfg:arm64:
    desc: Cross-compile the WiFi provisioning binary for the K2B (aarch64)
    cmds:
      - cd cli && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../bin/ct-netcfg-arm64 ./cmd/ct-netcfg

  # ── Lint Tasks ─────────────────────────────────────────────────

  generate:proto:v2:
    desc: Regenerate server/proto/v2/control.pb.go from proto/crosstalk/v2/control.proto
    cmds:
      - |
        set -euo pipefail
        # Pinned generator matching committed header (protoc-gen-go v1.36.11).
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
        OUT=$(mktemp -d)
        PATH="$(go env GOPATH)/bin:$PATH" protoc \
          --go_out="$OUT" \
          --go_opt=module=github.com/aleksclark/crosstalk/proto/gen/go \
          -I. \
          proto/crosstalk/v2/control.proto
        cp "$OUT/crosstalk/v2/control.pb.go" server/proto/v2/control.pb.go
        ABCDIR=$(mktemp -d)
        sed -e 's/^package crosstalk.v2;/package abc.internal.controlv2;/' \
            -e 's|option go_package = "github.com/aleksclark/crosstalk/proto/gen/go/crosstalk/v2;crosstalkv2";|option go_package = "github.com/aleksclark/crosstalk/abc/internal/controlv2;controlv2";|' \
            proto/crosstalk/v2/control.proto > "$ABCDIR/control.proto"
        ABCOUT=$(mktemp -d)
        PATH="$(go env GOPATH)/bin:$PATH" protoc \
          --go_out="$ABCOUT" \
          --go_opt=module=github.com/aleksclark/crosstalk/abc \
          -I"$ABCDIR" \
          "$ABCDIR/control.proto"
        mkdir -p abc/internal/controlv2
        cp "$ABCOUT/internal/controlv2/control.pb.go" abc/internal/controlv2/control.pb.go
        rm -rf "$OUT" "$ABCOUT" "$ABCDIR"
        echo "wrote server/proto/v2/control.pb.go"
        echo "wrote abc/internal/controlv2/control.pb.go"

  lint:go:
    desc: Run golangci-lint on abc, server, and cli
    cmds:
      - cd abc && golangci-lint run ./...
      - cd server && golangci-lint run ./...
      - cd cli && golangci-lint run ./...

  lint:web:
    desc: Lint (oxc) + typecheck the web apps (admin, broadcast, translator)
    cmds:
      - pnpm exec oxlint apps packages
      - pnpm --filter './apps/*' exec tsc --noEmit

  # ── API Client Generation ───────────────────────────────────

  api:spec:
    desc: Generate the OpenAPI spec from the Go server (source of truth)
    dir: server
    sources:
      - "**/*.go"
    generates:
      - ../{{.SPEC_FILE}}
    cmds:
      - go run ./cmd/gen-openapi ../{{.SPEC_FILE}}

  api:generate:
    desc: Regenerate the OpenAPI spec and all API clients
    cmds:
      - task: api:spec
      - task: api:generate:ts
      - task: api:generate:go
      - task: api:generate:android

  api:generate:ts:
    desc: Generate TypeScript types and client from the OpenAPI spec
    deps:
      - api:spec
    dir: packages/api-client
    sources:
      - ../../{{.SPEC_FILE}}
    generates:
      - src/types.ts
    cmds:
      - pnpm openapi-typescript ../../{{.SPEC_FILE}} -o src/types.ts

  api:generate:go:
    desc: Generate Go client from the OpenAPI spec
    deps:
      - api:spec
    dir: client
    sources:
      - ../{{.SPEC_FILE}}
      - oapi-codegen.yaml
    generates:
      - client.gen.go
    cmds:
      - "{{.OAPI_CODEGEN}} --config oapi-codegen.yaml ../{{.SPEC_FILE}}"
      - go mod tidy

  api:generate:android:
    desc: Generate Kotlin OkHttp client for the Android translator from the OpenAPI spec
    dir: apps/android-translator
    sources:
      - ../../{{.SPEC_FILE}}
      - openapi-generator-config.yaml
      - app/build.gradle.kts
    env:
      JAVA_HOME: '{{.JAVA_HOME | default "/usr/lib/jvm/java-17-openjdk"}}'
      ANDROID_HOME: '{{.ANDROID_HOME | default "/opt/android-sdk"}}'
      ANDROID_SDK_ROOT: '{{.ANDROID_SDK_ROOT | default "/opt/android-sdk"}}'
    cmds:
      - |
        if [ ! -f local.properties ]; then
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
        fi
      - ./gradlew --no-daemon openApiGenerate

  api:validate:
    desc: Verify generated clients compile
    cmds:
      - task: api:validate:ts
      - task: api:validate:go
      - task: api:validate:android

  api:validate:ts:
    desc: Typecheck the generated TypeScript client
    dir: packages/api-client
    cmds:
      - npx tsc --noEmit

  api:validate:go:
    desc: Build-check the generated Go client
    dir: client
    cmds:
      - go build ./...

  api:validate:android:
    desc: Regenerate and compile-check the Android OpenAPI client
    dir: apps/android-translator
    env:
      JAVA_HOME: '{{.JAVA_HOME | default "/usr/lib/jvm/java-17-openjdk"}}'
      ANDROID_HOME: '{{.ANDROID_HOME | default "/opt/android-sdk"}}'
      ANDROID_SDK_ROOT: '{{.ANDROID_SDK_ROOT | default "/opt/android-sdk"}}'
    cmds:
      - bash scripts/check-openapi-generated.sh

  test:android:unit:
    desc: Android translator unit tests + lint (JDK 17)
    dir: apps/android-translator
    env:
      JAVA_HOME: '{{.JAVA_HOME | default "/usr/lib/jvm/java-17-openjdk"}}'
      ANDROID_HOME: '{{.ANDROID_HOME | default "/opt/android-sdk"}}'
      ANDROID_SDK_ROOT: '{{.ANDROID_SDK_ROOT | default "/opt/android-sdk"}}'
    cmds:
      - |
        if [ ! -f local.properties ]; then
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
        fi
      - ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

  test:android:connected:
    desc: Android translator connectedDebugAndroidTest (requires device/emulator)
    dir: apps/android-translator
    env:
      JAVA_HOME: '{{.JAVA_HOME | default "/usr/lib/jvm/java-17-openjdk"}}'
      ANDROID_HOME: '{{.ANDROID_HOME | default "/opt/android-sdk"}}'
      ANDROID_SDK_ROOT: '{{.ANDROID_SDK_ROOT | default "/opt/android-sdk"}}'
    cmds:
      - |
        if [ ! -f local.properties ]; then
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
        fi
      - ./gradlew --no-daemon :app:connectedDebugAndroidTest

  test:android:golden:
    desc: Physical/emulator Android golden harness (see test/android/run-device-golden.sh)
    cmds:
      - bash test/android/run-device-golden.sh

  # ── Stacklane compose (additive; does not change host-dev or CI ports) ──

  dev:compose:check:
    desc: Fail-closed Stacklane compose contract check (docker-compose.dev.yml)
    cmds:
      - bash scripts/compose-dev.sh check

  dev:compose:up:
    desc: Start Stacklane compose stack (ephemeral 127.0.0.1 binds)
    cmds:
      - bash scripts/compose-dev.sh up

  dev:compose:status:
    desc: Stacklane compose status + endpoints
    cmds:
      - bash scripts/compose-dev.sh status

  dev:compose:endpoints:
    desc: Print Stacklane FQDNs and direct loopback URLs
    cmds:
      - bash scripts/compose-dev.sh endpoints

  dev:compose:logs:
    desc: Follow Stacklane compose logs (Ctrl-C leaves stack up)
    cmds:
      - bash scripts/compose-dev.sh logs {{.CLI_ARGS}}

  dev:compose:down:
    desc: Stop Stacklane compose stack (volumes preserved; never -v)
    cmds:
      - bash scripts/compose-dev.sh down

  dev:compose:destroy:
    desc: Destroy Stacklane compose stack and volumes (requires CONFIRM=<project>-destroy)
    cmds:
      - bash scripts/compose-dev.sh destroy
