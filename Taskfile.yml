version: "3"

vars:
  OAPI_CODEGEN: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.1
  SPEC_FILE: api/openapi.json

tasks:
  # ── Test Tasks ─────────────────────────────────────────────────

  test:unit:go:
    desc: Run Go unit tests for server and cli
    cmds:
      - cd server && go test ./...
      - cd cli && go test ./...

  test:unit:ts:
    desc: Run TypeScript type checking on all apps
    cmds:
      - pnpm --filter './web' exec tsc --noEmit
      - pnpm --filter './packages/*' exec tsc --noEmit
    ignore_error: true

  test:integration:
    desc: Run integration + audio-flow tests (in-process Go server + real PostgreSQL)
    env:
      CT_TEST_DATABASE_URL: '{{.CT_TEST_DATABASE_URL | default "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"}}'
    cmds:
      - cd server && go test ./cmd/ct-server/ -run Integration -v -count=1

  test:all:
    desc: Run all tests (unit + integration)
    cmds:
      - task: test:unit:go
      - task: test:unit:ts
      - task: test:integration

  # ── Build Tasks ────────────────────────────────────────────────

  build:server:
    desc: Build server binary
    cmds:
      - cd server && CGO_ENABLED=0 go build -o ../bin/ct-server ./cmd/ct-server

  build:cli:
    desc: Build CLI binary
    cmds:
      - cd cli && CGO_ENABLED=1 go build -o ../bin/ct-client ./cmd/ct-client

  # ── Lint Tasks ─────────────────────────────────────────────────

  lint:go:
    desc: Run golangci-lint on server and cli
    cmds:
      - cd server && golangci-lint run ./...
      - cd cli && golangci-lint run ./...

  lint:web:
    desc: ESLint + typecheck on web
    cmds:
      - pnpm --filter './web' exec tsc --noEmit
      - pnpm --filter './web' exec eslint .

  # ── API Client Generation ───────────────────────────────────

  api:spec:
    desc: Generate the OpenAPI spec from the Go server (source of truth)
    dir: server
    sources:
      - "**/*.go"
    generates:
      - ../{{.SPEC_FILE}}
    cmds:
      - go run ./cmd/gen-openapi ../{{.SPEC_FILE}}

  api:generate:
    desc: Regenerate the OpenAPI spec and all API clients
    cmds:
      - task: api:spec
      - task: api:generate:ts
      - task: api:generate:go

  api:generate:ts:
    desc: Generate TypeScript types and client from the OpenAPI spec
    deps:
      - api:spec
    dir: packages/api-client
    sources:
      - ../../{{.SPEC_FILE}}
    generates:
      - src/types.ts
    cmds:
      - pnpm openapi-typescript ../../{{.SPEC_FILE}} -o src/types.ts

  api:generate:go:
    desc: Generate Go client from the OpenAPI spec
    deps:
      - api:spec
    dir: client
    sources:
      - ../{{.SPEC_FILE}}
      - oapi-codegen.yaml
    generates:
      - client.gen.go
    cmds:
      - "{{.OAPI_CODEGEN}} --config oapi-codegen.yaml ../{{.SPEC_FILE}}"
      - go mod tidy

  api:validate:
    desc: Verify generated clients compile
    cmds:
      - task: api:validate:ts
      - task: api:validate:go

  api:validate:ts:
    desc: Typecheck the generated TypeScript client
    dir: packages/api-client
    cmds:
      - npx tsc --noEmit

  api:validate:go:
    desc: Build-check the generated Go client
    dir: client
    cmds:
      - go build ./...
